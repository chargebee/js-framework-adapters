name: Publish to NPM

on:
  release:
    types: [published]

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Release tag "@chargebee/entitlements@0.1.0" -> package "@chargebee/entitlements"
      - name: Resolve package
        run: echo "PACKAGE=${RELEASE_TAG%@*}" >> "$GITHUB_ENV"
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}

      # "..." also builds the workspace dependencies of the package
      - name: Build
        run: pnpm --filter "${PACKAGE}..." build

      - name: Lint
        run: pnpm lint

      - name: Publish config
        run: |
          pnpm config set '//registry.npmjs.org/:_authToken' "${NODE_AUTH_TOKEN}"
          if [ "${{ github.event.release.prerelease }}" = "true" ]; then
            echo "TAG=beta" >> "$GITHUB_ENV"
          else
            echo "TAG=latest" >> "$GITHUB_ENV"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish
        run: pnpm publish --filter "$PACKAGE" --no-git-checks --access public --tag "$TAG"
